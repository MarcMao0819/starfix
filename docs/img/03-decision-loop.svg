<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA3B2"/></marker></defs><rect width="1000" height="330" fill="#FFFFFF"/><text x="24" y="30" font-size="17" font-weight="700" fill="#1B1F27">图 3 · 决策闭环</text><text x="24" y="50" font-size="12" fill="#6B7280">等 Owner 的问题都在面板里；答复即解锁</text><rect x="40" y="70" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/><rect x="40" y="80" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="66" cy="98.0" r="11" fill="#2563EB"/><text x="66" y="102.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="86" y="95.0" font-size="14" font-weight="600" fill="#1B1F27">舰长 ask add</text><text x="86" y="113.0" font-size="11.5" fill="#6B7280">题干 + A/B/C + 推荐</text><rect x="370" y="70" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="370" y="80" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="396" cy="98.0" r="11" fill="#2563EB"/><text x="396" y="102.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="416" y="95.0" font-size="14" font-weight="600" fill="#1B1F27">task-activator.json</text><text x="416" y="113.0" font-size="11.5" fill="#6B7280">decisions[]</text><rect x="700" y="70" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="80" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="726" cy="98.0" r="11" fill="#2563EB"/><text x="726" y="102.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="746" y="95.0" font-size="14" font-weight="600" fill="#1B1F27">请示浮窗 / IM</text><text x="746" y="113.0" font-size="11.5" fill="#6B7280">Owner 点答（离席双写）</text><rect x="700" y="200" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="210" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="726" cy="228.0" r="11" fill="#2563EB"/><text x="726" y="232.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text><text x="746" y="225.0" font-size="14" font-weight="600" fill="#1B1F27">ask-inbox.jsonl</text><text x="746" y="243.0" font-size="11.5" fill="#6B7280">只追加，禁原地改写</text><rect x="370" y="200" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="370" y="210" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="396" cy="228.0" r="11" fill="#2563EB"/><text x="396" y="232.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text><text x="416" y="225.0" font-size="14" font-weight="600" fill="#1B1F27">ask-inbox-apply.sh</text><text x="416" y="243.0" font-size="11.5" fill="#6B7280">tail -F → ask answer</text><rect x="40" y="200" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/><rect x="40" y="210" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="66" cy="228.0" r="11" fill="#2563EB"/><text x="66" y="232.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text><text x="86" y="225.0" font-size="14" font-weight="600" fill="#1B1F27">任务解锁</text><text x="86" y="243.0" font-size="11.5" fill="#6B7280">blocker 清空 → 通知舰长</text><path d="M300,98 L370,98" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M630,98 L700,98" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M830,126 L830,200" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M700,228 L630,228" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M370,228 L300,228" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M170,200 L170,126" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)" stroke-dasharray="5 4"/><text x="24" y="300" font-size="12" fill="#6B7280">离席模式：同一题同时发 IM，两边答复落同一收件箱；凭据类答复落库前抹值。</text></svg>