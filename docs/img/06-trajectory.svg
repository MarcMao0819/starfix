" font-size="14" font-weight="600" fill="#1B1F27">异常分支 → LLM</text><text x="746" y="229.0" font-size="11.5" fill="#6B7280">不稳定分支才交模型，附上下文</text><rect x="20" y="276" width="960" height="90" rx="12" fill="#F3F5F9"/><text x="34" y="298" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">输出</text><rect x="60" y="292" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="60" y="302" width="4" height="36" rx="2" fill="#059669"/><circle cx="86" cy="320.0" r="11" fill="#059669"/><text x="86" y="324.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text><text x="106" y="317.0" font-size="14" font-weight="600" fill="#1B1F27">告警落盘 + 自清</text><text x="106" y="335.0" font-size="11.5" fill="#6B7280">祖先判据：head ∈ LIVE 即清</text><rect x="380" y="292" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="380" y="302" width="4" height="36" rx="2" fill="#059669"/><circle cx="406" cy="320.0" r="11" fill="#059669"/><text x="406" y="324.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text><text x="426" y="317.0" font-size="14" font-weight="600" fill="#1B1F27">回执机检</text><text x="426" y="335.0" font-size="11.5" fill="#6B7280">三态 / 证据段 / 关键词 / 路径</text><rect x="700" y="292" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="302" width="4" height="36" rx="2" fill="#059669"/><circle cx="726" cy="320.0" r="11" fill="#059669"/><text x="726" y="324.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">9</text><text x="746" y="317.0" font-size="14" font-weight="600" fill="#1B1F27">新判据回流</text><text x="746" y="335.0" font-size="11.5" fill="#6B7280">事故 → 夹具（含反向）→ 图 vN+1</text><path d="M330,108 L380,108" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M650,108 L700,108" fill="none" stroke="#9AA3B2"