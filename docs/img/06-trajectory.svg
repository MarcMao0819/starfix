<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA3B2"/></marker></defs><rect width="1000" height="420" fill="#FFFFFF"/><text x="24" y="30" font-size="17" font-weight="700" fill="#1B1F27">图 6 · 轨迹编译：把人审的轨迹编译成机器可复放的图</text><text x="24" y="50" font-size="12" fill="#6B7280">稳定判点机械化，LLM 只处理异常分支；每条判据配反向断言</text><rect x="20" y="64" width="960" height="90" rx="12" fill="#F3F5F9"/><text x="34" y="86" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">采集</text><rect x="60" y="80" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="60" y="90" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="86" cy="108.0" r="11" fill="#2563EB"/><text x="86" y="112.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="106" y="105.0" font-size="14" font-weight="600" fill="#1B1F27">审计轨迹</text><text x="106" y="123.0" font-size="11.5" fill="#6B7280">审一张单的每一步，每步输出 verdict=</text><rect x="380" y="80" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="380" y="90" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="406" cy="108.0" r="11" fill="#2563EB"/><text x="406" y="112.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="426" y="105.0" font-size="14" font-weight="600" fill="#1B1F27">归纳器 inducer</text><text x="426" y="123.0" font-size="11.5" fill="#6B7280">历史轨迹 → 节点图 + 判点稳定度</text><rect x="700" y="80" width="270" height="56" rx="10" fill="#FFFFFF"