<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA3B2"/></marker></defs><rect width="1000" height="420" fill="#FFFFFF"/><text x="24" y="30" font-size="17" font-weight="700" fill="#1B1F27">Fig 6 · Trajectory Compiler: a human audit trajectory compiled into a machine-replayable graph</text><text x="24" y="50" font-size="12" fill="#6B7280">Stable verdict points go mechanical; the LLM sees only abnormal branches; every criterion carries a reverse assertion</text><rect x="20" y="64" width="960" height="90" rx="12" fill="#F3F5F9"/><text x="34" y="86" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">CAPTURE</text><rect x="60" y="80" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="60" y="90" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="86" cy="108.0" r="11" fill="#2563EB"/><text x="86" y="112.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="106" y="105.0" font-size="14" font-weight="600" fill="#1B1F27">Audit trajectory</text><text x="106" y="123.0" font-size="11.5" fill="#6B7280">every step of one audit emits verdict=</text><rect x="380" y="80" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="380" y="90" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="406" cy="108.0" r="11" fill="#2563EB"/><text x="406" y="112.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="426" y="105.0" font-size="14" font-weight="600" fill="#1B1F27">Inducer</text><text x="426" y="123.0" font-size="11.5" fill="#6B7280">history → node graph + point stability</text><rect x="700" y="80" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="90" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="726" cy="108.0" r="11" fill="#2563EB"/><text x="726" y="112.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="746" y="105.0" font-size="14" font-weight="600" fill="#1B1F27">Workflow graph vN</text><text x="746" y="123.0" font-size="11.5" fill="#6B7280">nodes + verdict_rules (p1…p7)</text><rect x="20" y="170" width="960" height="90" rx="12" fill="#F3F5F9"/><text x="34" y="192" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">REPLAY</text><rect x="60" y="186" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="60" y="196" width="4" height="36" rx="2" fill="#D97706"/><circle cx="86" cy="214.0" r="11" fill="#D97706"/><text x="86" y="218.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text><text x="106" y="211.0" font-size="14" font-weight="600" fill="#1B1F27">Poller audit-poller</text><text x="106" y="229.0" font-size="11.5" fill="#6B7280">every minute: registration / deploy / route</text><rect x="380" y="186" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="380" y="196" width="4" height="36" rx="2" fill="#D97706"/><circle cx="406" cy="214.0" r="11" fill="#D97706"/><text x="406" y="218.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text><text x="426" y="211.0" font-size="14" font-weight="600" fill="#1B1F27">Runner run_graph</text><text x="426" y="229.0" font-size="11.5" fill="#6B7280">runs the graph; mechanical points emit verdict</text><rect x="700" y="186" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="196" width="4" height="36" rx="2" fill="#D97706"/><circle cx="726" cy="214.0" r="11" fill="#D97706"/><text x="726" y="218.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text><text x="746" y="211.0" font-size="14" font-weight="600" fill="#1B1F27">Abnormal branch → LLM</text><text x="746" y="229.0" font-size="11.5" fill="#6B7280">only unstable branches, with context</text><rect x="20" y="276" width="960" height="90" rx="12" fill="#F3F5F9"/><text x="34" y="298" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">OUTPUT</text><rect x="60" y="292" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="60" y="302" width="4" height="36" rx="2" fill="#059669"/><circle cx="86" cy="320.0" r="11" fill="#059669"/><text x="86" y="324.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text><text x="106" y="317.0" font-size="14" font-weight="600" fill="#1B1F27">Alerts land + self-clear</text><text x="106" y="335.0" font-size="11.5" fill="#6B7280">ancestor rule: head ∈ LIVE clears it</text><rect x="380" y="292" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="380" y="302" width="4" height="36" rx="2" fill="#059669"/><circle cx="406" cy="320.0" r="11" fill="#059669"/><text x="406" y="324.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text><text x="426" y="317.0" font-size="14" font-weight="600" fill="#1B1F27">Receipt machine check</text><text x="426" y="335.0" font-size="11.5" fill="#6B7280">states / evidence / keyword / path</text><rect x="700" y="292" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="302" width="4" height="36" rx="2" fill="#059669"/><circle cx="726" cy="320.0" r="11" fill="#059669"/><text x="726" y="324.0" text-anchor="middle" font-size="11" font-weight