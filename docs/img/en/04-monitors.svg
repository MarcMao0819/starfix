<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA3B2"/></marker></defs><rect width="1000" height="380" fill="#FFFFFF"/><text x="24" y="30" font-size="17" font-weight="700" fill="#1B1F27">Fig 4 · Senses: dangerous side only, transitions only, never poll</text><text x="24" y="50" font-size="12" fill="#6B7280">Every monitor must be able to answer &quot;has it ever gone red?&quot;</text><rect x="40" y="64" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="40" y="74" width="4" height="28" rx="2" fill="#D97706"/><text x="58" y="85.0" font-size="14" font-weight="600" fill="#1B1F27">Receipt monitor</text><text x="58" y="103.0" font-size="11.5" fill="#6B7280">new file in the receipt directory</text><rect x="40" y="122" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="40" y="132" width="4" height="28" rx="2" fill="#D97706"/><text x="58" y="143.0" font-size="14" font-weight="600" fill="#1B1F27">Inbox apply</text><text x="58" y="161.0" font-size="11.5" fill="#6B7280">answer → unlock</text><rect x="40" y="180" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="40" y="190" width="4" height="28" rx="2" fill="#D97706"/><text x="58" y="201.0" font-size="14" font-weight="600" fill="#1B1F27">Disconnect watchdog</text><text x="58" y="219.0" font-size="11.5" fill="#6B7280">crew state transition</text><rect x="40" y="238" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="40" y="248" width="4" height="28" rx="2" fill="#D97706"/><text x="58" y="259.0" font-size="14" font-weight="600" fill="#1B1F27">Stall sentinel</text><text x="58" y="277.0" font-size="11.5" fill="#6B7280">in flight, silent &gt; 60 min</text><rect x="40" y="296" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="40" y="306" width="4" height="28" rx="2" fill="#D97706"/><text x="58" y="317.0" font-size="14" font-weight="600" fill="#1B1F27">IM human replies</text><text x="58" y="335.0" font-size="11.5" fill="#6B7280">cursor continuation</text><rect x="700" y="64" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="74" width="4" height="28" rx="2" fill="#D97706"/><text x="718" y="85.0" font-size="14" font-weight="600" fill="#1B1F27">Machine-check poller</text><text x="718" y="103.0" font-size="11.5" fill="#6B7280">drift / gate / route 404</text><rect x="700" y="122" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="132" width="4" height="28" rx="2" fill="#D97706"/><text x="718" y="143.0" font-size="14" font-weight="600" fill="#1B1F27">Business health</text><text x="718" y="161.0" font-size="11.5" fill="#6B7280">consecutive FAILED · stalled</text><rect x="700" y="180" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="190" width="4" height="28" rx="2" fill="#D97706"/><text x="718" y="201.0" font-size="14" font-weight="600" fill="#1B1F27">Hourly report</text><text x="718" y="219.0" font-size="11.5" fill="#6B7280">in progress / pending / ⚠ unhandled</text><rect x="700" y="238" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="248" width="4" height="28" rx="2" fill="#D97706"/><text x="718" y="259.0" font-size="14" font-weight="600" fill="#1B1F27">Usage gate</text><text x="718" y="277.0" font-size="11.5" fill="#6B7280">≥95% stop dispatching</text><rect x="700" y="296" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="306" width="4" height="28" rx="2" fill="#D97706"/><text x="718" y="317.0" font-size="14" font-weight="600" fill="#1B1F27">Context watermark</text><text x="718" y="335.0" font-size="11.5" fill="#6B7280">≥95% → write the handoff</text><rect x="380" y="178" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/><rect x="380" y="188" width="4" height="44" rx="2" fill="#2563EB"/><text x="398" y="207.0" font-size="14" font-weight="600" fill="#1B1F27">Captain (main window)</text><text x="398" y="225.0" font-size="11.5" fill="#6B7280">act on arrival: dispatch / rule / escalate</text><path d="M300,88 L340,88 L340,210 L380,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M700,88 L660,88 L660,210 L620,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M300,146 L340,146 L340,210 L380,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M700,146 L660,146 L660,210 L620,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M300,204 L340,204 L340,210 L380,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M700,204 L660,204 L660,210 L620,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M300,262 L340,262 L340,210 L380,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M700,262 L660,262 L660,210 L620,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M300,320 L340,320 L340,210 L380,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M700,320 L660,320 L660,210 L620,210" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><text x="24" y="360" font-size="12" fill="#6B7280">No Monitor tool? Four-step fallback: background script writes event files → system timer → side window forwards → manual hourly patrol.</text></svg>