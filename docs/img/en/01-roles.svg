<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA3B2"/></marker></defs><rect width="1000" height="400" fill="#FFFFFF"/><text x="24" y="30" font-size="17" font-weight="700" fill="#1B1F27">Fig 1 · Roles and infrastructure</text><text x="24" y="50" font-size="12" fill="#6B7280">One captain (the AI main window) sits between the Owner and the fleet, and only judges</text><rect x="20" y="64" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="86" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">COMMAND</text><rect x="360" y="78" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/><rect x="360" y="88" width="4" height="36" rx="2" fill="#2563EB"/><text x="378" y="103.0" font-size="14" font-weight="600" fill="#1B1F27">Owner</text><text x="378" y="121.0" font-size="11.5" fill="#6B7280">Answers confirmation questions only; three kinds escalate</text><rect x="20" y="160" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="182" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">CAPTAIN</text><rect x="360" y="174" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/><rect x="360" y="184" width="4" height="36" rx="2" fill="#2563EB"/><text x="378" y="199.0" font-size="14" font-weight="600" fill="#1B1F27">Captain (main window)</text><text x="378" y="217.0" font-size="11.5" fill="#6B7280">dispatch · review · acceptance · merge · deploy · liaison</text><rect x="700" y="174" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="184" width="4" height="36" rx="2" fill="#059669"/><text x="718" y="199.0" font-size="14" font-weight="600" fill="#1B1F27">Stakeholders (IM)</text><text x="718" y="217.0" font-size="11.5" fill="#6B7280">QA / production / finance / commercial</text><rect x="20" y="256" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="278" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">CREW</text><rect x="60" y="270" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="60" y="280" width="4" height="36" rx="2" fill="#2563EB"/><text x="78" y="295.0" font-size="14" font-weight="600" fill="#1B1F27">Crew A</text><text x="78" y="313.0" font-size="11.5" fill="#6B7280">Codex CLI · terminal</text><rect x="380" y="270" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="380" y="280" width="4" height="36" rx="2" fill="#2563EB"/><text x="398" y="295.0" font-size="14" font-weight="600" fill="#1B1F27">Crew B</text><text x="398" y="313.0" font-size="11.5" fill="#6B7280">Claude · agent bus</text><rect x="700" y="270" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="280" width="4" height="36" rx="2" fill="#2563EB"/><text x="718" y="295.0" font-size="14" font-weight="600" fill="#1B1F27">Crew C</text><text x="718" y="313.0" font-size="11.5" fill="#6B7280">headless worker · batch</text><path d="M500,134 L500,174" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><rect x="420.2" y="144.0" width="159.6" height="20" rx="10" fill="#EAF1FF"/><text x="500.0" y="158.0" text-anchor="middle" font-size="11.5" fill="#2563EB">decision panel / inbox</text><path d="M640,202 L700,202" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><rect x="573.2" y="192.0" width="193.6" height="20" rx="10" fill="#EAF1FF"/><text x="670.0" y="206.0" text-anchor="middle" font-size="11.5" fill="#2563EB">ack in seconds · right role</text><path d="M500,230 L500,250 L200,250 L200,270" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M500,230 L500,250 L520,250 L520,270" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><path d="M500,230 L500,250 L840,250 L840,270" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m)"/><rect x="600.4" y="240.0" width="139.2" height="20" rx="10" fill="#EAF1FF"/><text x="670.0" y="254.0" text-anchor="middle" font-size="11.5" fill="#2563EB">task book / receipt</text><text x="24" y="380" font-size="12" fill="#6B7280">Infrastructure: task activator · receipt directory · monitors · terminal delivery · ask panel · context-handoff hooks · Trajectory Compiler</text></svg>