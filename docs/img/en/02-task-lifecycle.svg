<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA3B2"/></marker></defs><rect width="1000" height="470" fill="#FFFFFF"/><text x="24" y="30" font-size="17" font-weight="700" fill="#1B1F27">Fig 2 · One task, from dispatch to production</text><text x="24" y="50" font-size="12" fill="#6B7280">Every step lands a file; replace anyone (the captain included) and the process still stands</text><rect x="20" y="64" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="86" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">CAPTAIN</text><rect x="20" y="164" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="186" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">CREW</text><rect x="20" y="264" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="286" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">MONITORS / CHECKS</text><rect x="20" y="364" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="386" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">MERGE · DEPLOY</text><rect x="60" y="78" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="60" y="88" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="86" cy="106.0" r="11" fill="#2563EB"/><text x="86" y="110.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="106" y="103.0" font-size="14" font-weight="600" fill="#1B1F27">Write the task book</text><text x="106" y="121.0" font-size="11.5" fill="#6B7280">context pasted in · closing clause verbatim</text><rect x="300" y="78" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="300" y="88" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="326" cy="106.0" r="11" fill="#2563EB"/><text x="326" y="110.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="346" y="103.0" font-size="14" font-weight="600" fill="#1B1F27">Deliver</text><text x="346" y="121.0" font-size="11.5" fill="#6B7280">bus / terminal two-step read-back</text><rect x="60" y="178" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="60" y="188" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="86" cy="206.0" r="11" fill="#2563EB"/><text x="86" y="210.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="106" y="203.0" font-size="14" font-weight="600" fill="#1B1F27">Build + register</text><text x="106" y="221.0" font-size="11.5" fill="#6B7280">isolated worktree · exact-path commits</text><rect x="300" y="178" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="300" y="188" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="326" cy="206.0" r="11" fill="#2563EB"/><text x="326" y="210.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text><text x="346" y="203.0" font-size="14" font-weight="600" fill="#1B1F27">Receipt lands</text><text x="346" y="221.0" font-size="11.5" fill="#6B7280">PASS / FAIL / BLOCKED</text><rect x="300" y="278" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="300" y="288" width="4" height="36" rx="2" fill="#D97706"/><circle cx="326" cy="306.0" r="11" fill="#D97706"/><text x="326" y="310.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text><text x="346" y="303.0" font-size="14" font-weight="600" fill="#1B1F27">Receipt monitor wakes</text><text x="346" y="321.0" font-size="11.5" fill="#6B7280">① monitor → captain</text><rect x="540" y="78" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="540" y="88" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="566" cy="106.0" r="11" fill="#2563EB"/><text x="566" y="110.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text><text x="586" y="103.0" font-size="14" font-weight="600" fill="#1B1F27">Spot-check + cross-review</text><text x="586" y="121.0" font-size="11.5" fill="#6B7280">a receipt is not a fact; the artifact is</text><rect x="780" y="78" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="780" y="88" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="806" cy="106.0" r="11" fill="#2563EB"/><text x="806" y="110.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text><text x="826" y="103.0" font-size="14" font-weight="600" fill="#1B1F27">Update crew profile</text><text x="826" y="121.0" font-size="11.5" fill="#6B7280">done/rework/stop/self-caused</text><rect x="540" y="378" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="540" y="388" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="566" cy="406.0" r="11" fill="#2563EB"/><text x="566" y="410.0" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text><text x="586" y="403.0" font-size="14" font-weight="600" fill="#1B1F27">Merge through gates</text><text x="586" y="421.0" font-size="11.5" fill="#6B7280">two gates · contract · line endings</text><rect x="780" y="378" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="780" y="388" width="4" height="36" rx="2" fill="#2563EB"/><circle cx="806" cy="406.0" r="11" fill="#2563EB"/><t