="#6B7280">Files: CS-&lt;date&gt;-&lt;code&gt;-task.md → receipts/CS-&lt;date&gt;-&lt;code&gt;.md → registration table → version-truth file; scripts: send-to-session / task-activator / merge / deploy runbook</text></svg>