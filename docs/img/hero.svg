<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" width="1200" height="494" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA3B2"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="493" rx="16" fill="#FFFFFF" stroke="#E3E7EE"/><rect x="32" y="40" width="264" height="92" rx="12" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="32" y="54" width="4" height="64" rx="2" fill="#059669"/><text x="56" y="80" font-size="19" font-weight="700" fill="#1B1F27" text-anchor="start">你（负责人）</text><text x="56" y="108" font-size="14.5" font-weight="400" fill="#6B7280" text-anchor="start">只答选择题</text><text x="36" y="172" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">只有三类事会来问你</text><text x="36" y="200" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">· 不可逆的上线操作</text><text x="36" y="226" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">· 只有人知道的业务事实</text><text x="36" y="252" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">· 对外发布</text><rect x="424" y="40" width="384" height="280" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#sh)"/><text x="452" y="92" font-size="30" font-weight="700" fill="#1B1F27">舰长</text><text x="452" y="118" font-size="14.5" font-weight="400" fill="#6B7280" text-anchor="start">一个长期在线的 AI 会话</text><path d="M452,136 L780,136" stroke="#E3E7EE" stroke-width="1"/><circle cx="457" cy="161" r="3.5" fill="#2563EB"/><text x="472" y="167" font-size="16.5" font-weight="500" fill="#1B1F27" text-anchor="start">写任务书，派给合适的舰员</text><circle cx="457" cy="193" r="3.5" fill="#2563EB"/><text x="472" y="199" font-size="16.5" font-weight="500" fill="#1B1F27" text-anchor="start">验收实物，安排交叉复审</text><circle cx="457" cy="225" r="3.5" fill="#2563EB"/><text x="472" y="231" font-size="16.5" font-weight="500" fill="#1B1F27" text-anchor="start">合并、上线、写交接</text><rect x="452" y="256" width="328" height="38" rx="19" fill="#EAF1FF"/><text x="616" y="281" font-size="14.5" font-weight="700" fill="#2563EB" text-anchor="middle">只做判断，不写业务代码</text><rect x="936" y="40" width="232" height="280" rx="14" fill="#F3F5F9" stroke="#E3E7EE" stroke-width="1"/><text x="952" y="66" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">舰员 · 终端里的 AI 会话</text><rect x="950" y="80" width="204" height="58" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="950" y="91" width="4" height="36" rx="2" fill="#2563EB"/><text x="968" y="105" font-size="16" font-weight="600" fill="#1B1F27" text-anchor="start">舰员甲</text><text x="968" y="125" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">模型 A · 独立工作区</text><rect x="950" y="146" width="204" height="58" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="950" y="157" width="4" height="36" rx="2" fill="#2563EB"/><text x="968" y="171" font-size="16" font-weight="600" fill="#1B1F27" text-anchor="start">舰员乙</text><text x="968" y="191" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">模型 B · 独立工作区</text><rect x="950" y="212" width="204" height="58" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="950" y="223" width="4" height="36" rx="2" fill="#2563EB"/><text x="968" y="237" font-size="16" font-weight="600" fill="#1B1F27" text-anchor="start">舰员丙</text><text x="968" y="257" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">模型 C · 独立工作区</text><text x="1052" y="302" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">多家模型混编，互相复审</text><path d="M424,68 L304,68" fill="none" stroke="#9AA3B2" stroke-width="1.8" marker-end="url(#m)"/><text x="364.0" y="58" font-size="13.5" font-weight="600" fill="#2563EB" text-anchor="middle">选择题＋推荐</text><path d="M296,104 L416,104" fill="none" stroke="#9AA3B2" stroke-width="1.8" marker-end="url(#m)"/><text x="356.0" y="126" font-size="13.5" font-weight="600" fill="#2563EB" text-anchor="middle">一键答复</text><path d="M808,160 L928,160" fill="none" stroke="#9AA3B2" stroke-width="1.8" marker-end="url(#m)"/><text x="868.0" y="150" font-size="13.5" font-weight="600" fill="#2563EB" text-anchor="middle">任务书</text><path d="M936,204 L816,204" fill="none" stroke="#9AA3B2" stroke-width="1.8" marker-end="url(#m)"/><text x="876.0" y="226" font-size="13.5" font-weight="600" fill="#2563EB" text-anchor="middle">回执</text><rect x="32" y="352" width="1136" height="110" rx="14" fill="#F3F5F9" stroke="#E3E7EE" stroke-width="1"/><text x="52" y="380" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">每一步都落成文件</text><rect x="52" y="396" width="132" height="40" rx="20" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1"/><text x="118" y="421" font-size="14.5" font-weight="600" fill="#1B1F27" text-anchor="middle">任务书</text><path d="M188,416 L204,416" fill="none" stroke="#9AA3B2" stroke-width="1.8" marker-end="url(#m)"/><rect x="208" y="396" width="132" height="40" rx="20" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1"/><text x="274" y="421" font-size="14.5" font-weight="600" fill="#1B1F27" text-anchor="middle">回执</text><path d="M344,416 L360,416" fill="none" stroke="#9AA3B2" stroke-width="1.8" marker-end="url(#m)"/><rect x="364" y="396" width="132" height="40" rx="20" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1"/><text x="430" y="421" font-size="14.5" font-weight="600" fill="#1B1F27" text-anchor="middle">变更登记</text><path d="M500,416 L516,416" fill="none" stroke="#9AA3B2" stroke-width="1.8" marker-end="url(#m)"/><rect x="520" y="396" width="132" height="40" rx="20" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1"/><text x="586" y="421" font-size="14.5" font-weight="600" fill="#1B1F27" text-anchor="middle">合并门禁</text><path d="M656,416 L672,416" fill="none" stroke="#9AA3B2" stroke-width="1.8" marker-end="url(#m)"/><rect x="676" y="396" width="132" height="40" rx="20" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1"/><text x="742" y="421" font-size="14.5" font-weight="600" fill="#1B1F27" text-anchor="middle">上线记录</text><text x="852" y="411" font-size="14.5" font-weight="500" fill="#1B1F27" text-anchor="start">换掉任何一个会话（包括舰长），</text><text x="852" y="435" font-size="14.5" font-weight="500" fill="#1B1F27" text-anchor="start">项目照样接得上。</text></svg>