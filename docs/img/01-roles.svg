<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/></filter><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA3B2"/></marker></defs><rect width="1000" height="400" fill="#FFFFFF"/><text x="24" y="30" font-size="17" font-weight="700" fill="#1B1F27">图 1 · 角色与基建</text><text x="24" y="50" font-size="12" fill="#6B7280">一个舰长（AI 主窗）在 Owner 与舰队之间，只做判断</text><rect x="20" y="64" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="86" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">指挥</text><rect x="360" y="78" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/><rect x="360" y="88" width="4" height="36" rx="2" fill="#2563EB"/><text x="378" y="103.0" font-size="14" font-weight="600" fill="#1B1F27">Owner / 指挥官</text><text x="378" y="121.0" font-size="11.5" fill="#6B7280">只答确认题；三类事才上升</text><rect x="20" y="160" width="960" height="84" rx="12" fill="#F3F5F9"/><text x="34" y="182" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">舰长</text><rect x="360" y="174" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/><rect x="360" y="184" width="4" height="36" rx="2" fill="#2563EB"/><text x="378" y="199.0" font-size="14" font-weight="600" fill="#1B1F27">舰长（主窗）</text><text x="378" y="217.0" font-size="11.5" fill="#6B7280">派单 · 复审 · 验收 · 并线 · 部署 · 对接</text><rect x="700" y="174" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#E3E7EE" stroke-width="1" filter="url(#sh)"/><rect x="700" y="184" width="4" height="36" rx="2" fill="#059669"/><text x="718" y